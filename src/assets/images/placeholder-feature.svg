<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="Feature illustration showing data visualization and analytics">
  <rect width="600" height="300" fill="#f0f4ff"/>
  <!-- Chart area -->
  <rect x="40" y="30" width="520" height="240" rx="8" fill="#fff" stroke="#d0d7e6" stroke-width="1.5"/>
  <!-- Chart title -->
  <rect x="60" y="50" width="120" height="10" rx="3" fill="#495057"/>
  <rect x="60" y="68" width="80" height="6" rx="2" fill="#adb5bd"/>
  <!-- Bar chart -->
  <rect x="80" y="200" width="40" height="50" rx="3" fill="#4c6ef5" opacity="0.7"/>
  <rect x="140" y="160" width="40" height="90" rx="3" fill="#4c6ef5" opacity="0.8"/>
  <rect x="200" y="130" width="40" height="120" rx="3" fill="#4c6ef5" opacity="0.85"/>
  <rect x="260" y="110" width="40" height="140" rx="3" fill="#4c6ef5" opacity="0.9"/>
  <rect x="320" y="100" width="40" height="150" rx="3" fill="#4c6ef5"/>
  <rect x="380" y="140" width="40" height="110" rx="3" fill="#4c6ef5" opacity="0.85"/>
  <rect x="440" y="170" width="40" height="80" rx="3" fill="#4c6ef5" opacity="0.75"/>
  <!-- X axis -->
  <line x1="70" y1="252" x2="500" y2="252" stroke="#dee2e6" stroke-width="1"/>
  <!-- Trend line -->
  <polyline points="100,195 160,155 220,125 280,105 340,95 400,135 460,165" fill="none" stroke="#ff6b6b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
  <!-- Legend -->
  <rect x="400" y="50" width="10" height="10" rx="2" fill="#4c6ef5"/>
  <rect x="416" y="52" width="50" height="6" rx="2" fill="#868e96"/>
  <rect x="400" y="68" width="10" height="10" rx="2" fill="#ff6b6b"/>
  <rect x="416" y="70" width="40" height="6" rx="2" fill="#868e96"/>
</svg>
