<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" fill="none">
  <rect width="600" height="300" rx="12" fill="#F0FDF4"/>
  <!-- Chart area -->
  <rect x="60" y="30" width="480" height="240" rx="8" fill="#fff" stroke="#BBF7D0" stroke-width="2"/>
  <!-- Y-axis labels -->
  <text x="48" y="70" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="end">40</text>
  <text x="48" y="120" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="end">30</text>
  <text x="48" y="170" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="end">20</text>
  <text x="48" y="220" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="end">10</text>
  <!-- Grid lines -->
  <line x1="60" y1="66" x2="540" y2="66" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="60" y1="116" x2="540" y2="116" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="60" y1="166" x2="540" y2="166" stroke="#E2E8F0" stroke-width="0.5"/>
  <line x1="60" y1="216" x2="540" y2="216" stroke="#E2E8F0" stroke-width="0.5"/>
  <!-- Bar chart -->
  <rect x="90"  y="96"  width="40" height="150" rx="4" fill="#4F46E5" opacity="0.8"/>
  <rect x="160" y="116" width="40" height="130" rx="4" fill="#4F46E5" opacity="0.8"/>
  <rect x="230" y="76"  width="40" height="170" rx="4" fill="#4F46E5" opacity="0.8"/>
  <rect x="300" y="66"  width="40" height="180" rx="4" fill="#4F46E5"/>
  <rect x="370" y="86"  width="40" height="160" rx="4" fill="#4F46E5" opacity="0.8"/>
  <rect x="440" y="56"  width="40" height="190" rx="4" fill="#22C55E"/>
  <!-- X-axis labels -->
  <text x="110" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 1</text>
  <text x="180" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 2</text>
  <text x="250" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 3</text>
  <text x="320" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 4</text>
  <text x="390" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 5</text>
  <text x="460" y="260" font-size="9" fill="#64748B" font-family="sans-serif" text-anchor="middle">Week 6</text>
</svg>
