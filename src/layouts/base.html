<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{{ description | default: 'A static site built with Eleventy' }}">
  <title>{{ title | default: 'Static Site' }}</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="site-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand">Static Site</a>
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
      </ul>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <p>&copy; {{ "now" | date: "%Y" }} Static Site</p>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
