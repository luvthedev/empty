<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title | default("My Site") }}</title>
  <meta name="description" content="{{ description | default("A static site built with Eleventy") }}">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <nav class="site-nav">
    <a href="/" class="nav-brand">My Site</a>
    <ul class="nav-links">
      <li><a href="/">Home</a></li>
    </ul>
  </nav>

  <main class="content">
    {{ content | safe }}
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 My Site</p>
  </footer>

  <script src="/assets/js/main.js" defer></script>
</body>
</html>
